<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">CHEEMS running animation</title>
  <desc id="desc">A colorful animated dog runs along a winding trail toward a bouncing bone.</desc>

  <style>
    .background { fill: #fffaf4; }
    .border { fill: none; stroke: #ffd7cc; }
    .trail-shadow { stroke: #d8dee4; }

    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .border { stroke: #30363d; }
      .trail-shadow { stroke: #30363d; }
    }
  </style>

  <defs>
    <linearGradient id="rainbow" x1="55" y1="0" x2="845" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b6b" />
      <stop offset=".25" stop-color="#ffd93d" />
      <stop offset=".5" stop-color="#6bcb77" />
      <stop offset=".75" stop-color="#4d96ff" />
      <stop offset="1" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="dog-coat" x1="-30" y1="-20" x2="30" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9c46b" />
      <stop offset="1" stop-color="#d98f39" />
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <path id="route" d="M70 112 C165 42 270 145 380 82 S590 124 705 69 S802 92 824 94" />
  </defs>

  <rect class="background" x="1" y="1" width="898" height="178" rx="28" />
  <rect x="1" y="1" width="898" height="178" rx="28" fill="url(#rainbow)" opacity=".055" />
  <rect class="border" x="1.5" y="1.5" width="897" height="177" rx="27.5" stroke-width="3" />

  <g filter="url(#glow)">
    <circle cx="92" cy="42" r="4" fill="#ff6b6b">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="38" r="4" fill="#ffd93d">
      <animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;3;5" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="475" cy="34" r="4" fill="#6bcb77">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="655" cy="39" r="4" fill="#4d96ff">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;3;5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="806" cy="38" r="4" fill="#9d4edd">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;5;3" dur="1.9s" repeatCount="indefinite" />
    </circle>
  </g>

  <use href="#route" fill="none" class="trail-shadow" stroke-width="12" stroke-linecap="round" opacity=".42" />
  <use href="#route" fill="none" stroke="url(#rainbow)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.2s" repeatCount="indefinite" />
  </use>

  <g>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route" />
    </animateMotion>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".46s" repeatCount="indefinite" />

      <g>
        <path d="M-28 -2 Q-43 -15 -47 -5 Q-40 -3 -31 8" fill="none" stroke="#d98f39" stroke-width="7" stroke-linecap="round" />
        <animateTransform attributeName="transform" type="rotate" values="-14 -28 -2;18 -28 -2;-14 -28 -2" dur=".38s" repeatCount="indefinite" />
      </g>

      <ellipse cx="-9" cy="0" rx="24" ry="14" fill="url(#dog-coat)" />
      <ellipse cx="-4" cy="4" rx="13" ry="8" fill="#ffe2a8" opacity=".72" />

      <path d="M-22 10 L-22 19" stroke="#b9702d" stroke-width="6" stroke-linecap="round">
        <animate attributeName="d" values="M-22 10 L-22 19;M-22 10 L-16 17;M-22 10 L-22 19" dur=".46s" repeatCount="indefinite" />
      </path>
      <path d="M3 10 L8 18" stroke="#b9702d" stroke-width="6" stroke-linecap="round">
        <animate attributeName="d" values="M3 10 L8 18;M3 10 L3 19;M3 10 L8 18" dur=".46s" repeatCount="indefinite" />
      </path>

      <circle cx="15" cy="-8" r="14" fill="url(#dog-coat)" />
      <path d="M7 -19 L10 -33 L18 -20 Z" fill="#b9702d" />
      <path d="M18 -20 L29 -31 L26 -13 Z" fill="#b9702d" />
      <ellipse cx="22" cy="-4" rx="9" ry="7" fill="#ffe2a8" />
      <circle cx="18" cy="-11" r="2.2" fill="#3d2b1f" />
      <circle cx="28" cy="-5" r="2.8" fill="#3d2b1f" />
      <path d="M27 0 Q22 4 18 0" fill="none" stroke="#7c4a27" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite" />
    <g transform="translate(853 91) rotate(-18)">
      <rect x="-16" y="-5" width="32" height="10" rx="5" fill="#f5f0e8" stroke="#c8bcae" stroke-width="2" />
      <circle cx="-17" cy="-5" r="7" fill="#f5f0e8" stroke="#c8bcae" stroke-width="2" />
      <circle cx="-17" cy="5" r="7" fill="#f5f0e8" stroke="#c8bcae" stroke-width="2" />
      <circle cx="17" cy="-5" r="7" fill="#f5f0e8" stroke="#c8bcae" stroke-width="2" />
      <circle cx="17" cy="5" r="7" fill="#f5f0e8" stroke="#c8bcae" stroke-width="2" />
    </g>
  </g>
</svg>
